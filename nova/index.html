<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NOVA | NowySystems</title>
  <meta name="description" content="NOVA — the Nowy Operational Virtual Assistant, embedded in NowySystems." />
  <meta name="theme-color" content="#050608" />
  <meta name="color-scheme" content="dark" />
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #050608; color: #f5f7fa; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { min-height: 100dvh; display: flex; flex-direction: column; }
    .site-header { min-height: 76px; padding: 14px clamp(18px,4vw,56px); display: flex; align-items: center; justify-content: space-between; gap: 20px; border-bottom: 1px solid rgba(255,255,255,.08); background: rgba(5,6,8,.96); }
    .brand { display: inline-flex; align-items: center; gap: 12px; color: inherit; text-decoration: none; font-weight: 700; letter-spacing: -.02em; }
    .brand img { width: 34px; height: auto; display: block; }
    .brand-wordmark { font-size: 1.02rem; }
    .nova-wordmark { display: flex; align-items: baseline; gap: 8px; }
    .nova-wordmark strong { font-size: 1rem; letter-spacing: .18em; }
    .nova-wordmark span { color: #9299a6; font-size: .72rem; text-transform: uppercase; letter-spacing: .14em; }
    .back { color: #c7ccd5; text-decoration: none; font-size: .86rem; }
    .back:hover { color: white; }
    .shell { flex: 1; min-height: 0; position: relative; background: #050608; }
    iframe { width: 100%; height: calc(100dvh - 76px); border: 0; display: block; background: #050608; }
    .fallback { position: absolute; inset: 18px; z-index: -1; color: #aeb5c0; }
    @media (max-width: 640px) {
      .site-header { min-height: 62px; padding: 10px 14px; }
      .brand-wordmark { display: none; }
      .nova-wordmark span { display: none; }
      iframe { height: calc(100dvh - 62px); }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/" aria-label="NowySystems home">
      <img src="../assets/nowysystems-mark-approved-exact.svg" alt="" width="34" height="38" />
      <span class="brand-wordmark">NowySystems</span>
    </a>
    <div class="nova-wordmark" aria-label="NOVA">
      <strong>NOVA</strong><span>Operational Assistant</span>
    </div>
    <a class="back" href="/">Back to NowySystems</a>
  </header>

  <main class="shell">
    <p class="fallback">Loading NOVA…</p>
    <iframe
      src="https://nova-ll-cole-js-projects.vercel.app"
      title="NOVA Console"
      allow="microphone; autoplay; clipboard-read; clipboard-write"
      referrerpolicy="strict-origin-when-cross-origin"
    ></iframe>
  </main>
</body>
</html>
