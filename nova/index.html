<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NOVA | NowySystems</title>
  <meta name="description" content="NOVA — the Nowy Operational Virtual Assistant for NowySystems." />
  <meta name="theme-color" content="#050608" />
  <meta name="color-scheme" content="dark" />
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #050608; color: #f5f7fa; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { min-height: 100dvh; display: grid; place-items: center; overflow: hidden; }
    .ambient { position: fixed; inset: -20%; pointer-events: none; background: radial-gradient(circle at 35% 30%, rgba(201,167,92,.15), transparent 30%), radial-gradient(circle at 75% 60%, rgba(76,98,130,.12), transparent 28%); filter: blur(30px); }
    .shell { position: relative; z-index: 1; width: min(760px, calc(100% - 32px)); padding: clamp(28px,6vw,64px); border: 1px solid rgba(255,255,255,.09); background: rgba(9,11,15,.9); box-shadow: 0 30px 90px rgba(0,0,0,.45); }
    .brand { display: inline-flex; align-items: center; gap: 12px; color: inherit; text-decoration: none; font-weight: 700; }
    .brand img { width: 38px; height: auto; }
    .eyebrow { margin-top: 48px; color: #c8a75d; font-size: .76rem; text-transform: uppercase; letter-spacing: .19em; font-weight: 700; }
    h1 { margin: 12px 0 14px; font-size: clamp(3rem,10vw,6.5rem); line-height: .92; letter-spacing: -.065em; }
    h1 span { color: #c8a75d; }
    p { max-width: 620px; color: #aeb5c0; font-size: clamp(1rem,2vw,1.15rem); line-height: 1.65; }
    .actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 30px; }
    .button { min-height: 48px; padding: 0 20px; display: inline-flex; align-items: center; justify-content: center; border-radius: 3px; text-decoration: none; font-weight: 750; letter-spacing: -.01em; }
    .primary { color: #050608; background: #d1ad5f; }
    .secondary { color: #e7eaf0; border: 1px solid rgba(255,255,255,.15); }
    .tool { color: #e7eaf0; border: 1px solid rgba(209,173,95,.45); background: rgba(209,173,95,.08); }
    .status { margin-top: 28px; display: flex; align-items: center; gap: 8px; color: #89919e; font-size: .82rem; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #56d38b; box-shadow: 0 0 16px rgba(86,211,139,.6); }
    @media (max-width: 600px) {
      body { overflow: auto; align-items: stretch; }
      .shell { width: 100%; min-height: 100dvh; border: 0; padding: 28px 20px; display: flex; flex-direction: column; justify-content: center; }
      .eyebrow { margin-top: 38px; }
      .actions { flex-direction: column; }
      .button { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="ambient" aria-hidden="true"></div>
  <main class="shell">
    <a class="brand" href="/" aria-label="NowySystems home">
      <img src="../assets/nowysystems-mark-approved-exact.svg" alt="" width="38" height="42" />
      <span>NowySystems</span>
    </a>
    <div class="eyebrow">Nowy Operational Virtual Assistant</div>
    <h1>NOVA<span>.</span></h1>
    <p>Your persistent NowySystems operating surface for conversation, memory, voice, project context, approved actions, and connected operational tools.</p>
    <div class="actions">
      <a class="button primary" href="https://nova-ll-cole-js-projects.vercel.app">Open NOVA <span aria-hidden="true">&nbsp;→</span></a>
      <a class="button tool" href="https://fantasy-war-room-six.vercel.app/">Fantasy War Room <span aria-hidden="true">&nbsp;→</span></a>
      <a class="button secondary" href="/">Back to NowySystems</a>
    </div>
    <div class="status"><span class="dot"></span> NOVA + connected app launchpad online</div>
  </main>
</body>
</html>
